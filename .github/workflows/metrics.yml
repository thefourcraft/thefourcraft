# Generate "deep dive" SVG cards via lowlighter/metrics.
# Runs in the GitHub Actions runner, writes SVGs into
# website/public/metrics/ on the default branch, which are then
# served by the dfwebsite Cloudflare Worker at
# https://david-furman.com/metrics/*.svg. No external services at
# render time.

name: Metrics (profile cards)

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [production]
    paths: ['.github/workflows/metrics.yml']

permissions:
  contents: write

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Render profile cards
    runs-on: ubuntu-latest
    env:
      USER: thefourcraft
      TZ: Asia/Jerusalem
    steps:
      - uses: actions/checkout@v4

      # ── 1. Isocalendar: full-year 3D contribution calendar ──────────────
      - name: isocalendar
        uses: lowlighter/metrics@v3.34
        continue-on-error: true
        with:
          filename: website/public/metrics/isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ env.USER }}
          template: classic
          base: ''
          config_timezone: ${{ env.TZ }}
          config_output: svg
          config_animations: no
          output_action: commit
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ── 2. Notable: contributions to external orgs/repos ────────────────
      - name: notable
        uses: lowlighter/metrics@v3.34
        continue-on-error: true
        with:
          filename: website/public/metrics/notable.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ env.USER }}
          template: classic
          base: ''
          config_output: svg
          config_animations: no
          output_action: commit
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_types: commit
          plugin_notable_self: yes

      # ── 3. Languages (in-depth, includes private repos) ─────────────────
      - name: languages
        uses: lowlighter/metrics@v3.34
        continue-on-error: true
        with:
          filename: website/public/metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ env.USER }}
          template: classic
          base: ''
          config_output: svg
          config_animations: no
          output_action: commit
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 12
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15

      # ── 4. Followup: PR lifecycle (opened / merged / still-open) ────────
      - name: followup
        uses: lowlighter/metrics@v3.34
        continue-on-error: true
        with:
          filename: website/public/metrics/followup.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ env.USER }}
          template: classic
          base: ''
          config_output: svg
          config_animations: no
          output_action: commit
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          plugin_followup_indepth: yes

      # ── 5. Activity: recent public + private events ─────────────────────
      - name: activity
        uses: lowlighter/metrics@v3.34
        continue-on-error: true
        with:
          filename: website/public/metrics/activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ env.USER }}
          template: classic
          base: ''
          config_output: svg
          config_animations: no
          output_action: commit
          plugin_activity: yes
          plugin_activity_limit: 10
          plugin_activity_days: 14
          plugin_activity_visibility: all
          plugin_activity_timestamps: yes

      # ── 6. Lines of code: total additions / deletions ───────────────────
      # plugin_lines_delay gives GitHub's stats API time to compute on first call.
      - name: lines
        uses: lowlighter/metrics@v3.34
        continue-on-error: true
        with:
          filename: website/public/metrics/lines.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ env.USER }}
          template: classic
          base: ''
          config_output: svg
          config_animations: no
          output_action: commit
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 0
          plugin_lines_delay: 3

      # ── 8. Stargazers: star count chart over time ────────────────────────
      - name: stargazers
        uses: lowlighter/metrics@v3.34
        continue-on-error: true
        with:
          filename: website/public/metrics/stargazers.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ env.USER }}
          template: classic
          base: ''
          config_output: svg
          config_animations: no
          output_action: commit
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: classic

      # Trigger the deploy workflow so newly committed SVGs go live.
      # GITHUB_TOKEN pushes don't auto-trigger other workflows, so we
      # use METRICS_TOKEN (classic PAT with workflow scope).
      - name: trigger deploy
        if: always()
        run: gh workflow run deploy.yml --ref production
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}

      # Each plugin commits its own SVG directly. continue-on-error
      # above ensures one failure doesn't block the rest.
